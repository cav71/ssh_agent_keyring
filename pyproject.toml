[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-agent-keyring"
version = "0.6.1"
description = "A Python keyring backend unlocked by ssh-agent signatures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41.0.0",
  "keyring>=25.0.0",
  "paramiko>=3.0.0",
]

[dependency-groups]
dev = [
    "build",
    "tomli >= 2.0.0; python_version < '3.11'",
    "pytest",
]

[tool.setuptools]
packages = ["ssh_agent_keyring"]


[project.urls]
Source = "https://github.com/monperrus/ssh_agent_keyring"
Issues = "https://github.com/monperrus/ssh_agent_keyring/issues"
