name: Upload Package to PyPI
# authorization handled via trusted publishers / OIDC or use a PYPI_API_TOKEN secret
on:
  push:
    tags:
      - v*
      

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@v10.0.1

      - shell: bash
          run: uv sync --no-managed-python

      - name: Build wheel
        uses: cav71/action-build-wheel@uv/v1
        with:
          files: |
            README.md
            ssh_agent_keyring/__init__.py

      - name: Publish package
        # This can use OIDC (no secret) if configured as a trusted publisher on PyPI,
        # or use a repository secret named PYPI_API_TOKEN. Keep both options available.
        uses: pypa/gh-action-pypi-publish@release@v1.14.3
        with: {}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
